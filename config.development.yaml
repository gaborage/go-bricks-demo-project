# =============================================================================
# Go-Bricks Demo Project — Development Overlay
# =============================================================================
# Environment: development (loaded when APP_ENV=development, which is also the
# framework's default app.env). Merged ON TOP of the base config.yml, which
# holds every environment-neutral setting (server paths, outbox, inbox,
# scheduler, log filter, database types and timezones). This file adds only
# what is local to the docker-compose stack and `make run`: infrastructure
# hosts, ports and credentials, the certs/ key material, and dev/benchmark
# knobs. Environment variables override both files (e.g., APP_NAME overrides
# app.name). Other environments: see wiki/DEPLOYING.md.
# =============================================================================

# --- HTTP Server ------------------------------------------------------------
# server.path.* lives in config.yml.
server:
  # go-bricks v0.41.0 (#559, ADR-026) flipped the gzip threshold default from 0
  # (compress everything) to 1024 bytes, so responses < 1KB now ship uncompressed.
  # Pinned to 0 here to hold wire behavior constant vs v0.39.1 for the perf A/B —
  # otherwise small product/error JSON silently switches to plaintext and
  # confounds response-size/bandwidth comparisons. Set to 1024 (or delete this
  # block) to adopt the current framework default.
  gzip:
    minlength: 0

# --- Messaging (RabbitMQ) ---------------------------------------------------
# AMQP broker URL. Required for the outbox relay to publish events; without it
# the relay job logs "messaging not available" every poll_interval (5s).
# docker-compose runs RabbitMQ on localhost:5672. The URL omits user info on
# purpose — the Go amqp091 client fills guest/guest by default, and the broker
# is configured (etc/docker/rabbitmq/rabbitmq.conf) to accept guest from any
# source so credentials don't need to live in config files.
#
# The environment-neutral messaging knobs (consumers.critical, publishtimeout,
# seal.active, declare.externalwait) are documented, commented out, in config.yml.
messaging:
  broker:
    url: "amqp://localhost:5672/"

  # --- Native stream protocol — activity module (ADR-059 / ADR-063 / ADR-091) -
  # The lane and its ADR-091 build-graph switch are explained in config.yml.
  # etc/docker/docker-compose.yml publishes 5552 and mounts
  # etc/docker/rabbitmq/enabled_plugins to turn the plugin on.
  #
  # Credentials are spelled out here, unlike the AMQP url above: the stream
  # client does not default them. %2f is the URL-encoded default vhost "/".
  # Plaintext rabbitmq-stream:// is fine in development but WARNs outside it —
  # production terminates TLS in front of the broker or uses
  # rabbitmq-stream+tls:// (5551).
  streams:
    uri: "rabbitmq-stream://guest:guest@localhost:5552/%2f"

    # THE DOCKER TRAP (go-bricks wiki/streams.md, Configuration): a stream
    # client opens ONE connection per partition, and it learns where to dial
    # from the broker's own metadata response. Inside Docker the broker
    # advertises its container-internal address, which is unreachable from the
    # host — so the first connection (to the address in `uri`) succeeds and the
    # per-partition connections then fail. The address resolver pins every
    # connection to this one entry point instead. Required behind any port
    # mapping, NAT, or load balancer. Set BOTH fields or neither.
    addressresolver:
      host: localhost
      port: 5552

    # Offsets are stored SERVER-SIDE for a named consumer, which is what lets a
    # restart resume where it left off. They are committed only AFTER a handler
    # returns successfully, so this knob trades commit traffic against how much
    # already-handled work a crash replays.
    offsetstore:
      # A pending offset is committed on whichever comes FIRST: this many
      # successfully handled messages, or `flushinterval` since the last commit.
      # So the framework default of 500 would not stop a low-volume demo from
      # committing at all — the 5s flush below does it regardless. Lowering the
      # count to 10 only makes the COUNT-driven commit reachable, so a short
      # burst of product writes exercises that path instead of always the timer.
      # Production leaves this at the default.
      countbeforestorage: 10
      # flushinterval: 5s   # default: commit a pending offset after this long

# --- Products report job: advisory-lock hold (demo only) --------------------
# The products report job ("test-job", every 30s) runs under a PostgreSQL
# advisory lock taken on a pinned database Session (go-bricks v0.65.0,
# ADR-112), so with several replicas only one generates the report at a time
# (internal/modules/products/job). custom.products.report.hold keeps that lock
# held for a Go duration after the report, standing in for a slow render and
# upload. Unset means no hold, which is what `make run` uses. Only
# scripts/advisory-lock-demo.sh sets it, through CUSTOM_PRODUCTS_REPORT_HOLD on
# the replicas it starts. A malformed or negative value fails startup. YAML
# allows ONE top-level custom: key per file; config.yml carries the
# environment-neutral custom.* switches (custom.partnerfeed.enabled).
# custom:
#   products:
#     report:
#       hold: 8s

# --- Application ------------------------------------------------------------
# Rate limiting: framework defaults are app.rate.limit=100 / burst=200 per IP.
# The bundled k6 load tests (50+ VUs) blow through that limit and surface as
# 5-10% HTTP 429s, which makes them measure the limiter, not the pipeline they're
# supposed to benchmark. Raised here so dev/benchmark runs are unbottlenecked.
# Production typically tunes these per-tenant or relies on a CDN/WAF for IP
# throttling.
app:
  rate:
    limit: 2000
    burst: 4000

  # go-bricks v0.61.0 (ADR-084) gates the response body's error.details on
  # app.debug AND a development environment — the env alone used to be enough.
  # Without this the demo's 400s still carry code/message but lose the details
  # map, so the validationErrors list that makes the validation demo legible
  # never reaches the client. Development-only: details echo schema facts that
  # production responses should not carry.
  debug: true

# --- Default Database -------------------------------------------------------
# The docker-compose Postgres. type and timezone live in config.yml.
database:
  host: localhost
  port: 5432
  database: postgres
  username: postgres
  password: postgres

# --- Named Databases --------------------------------------------------------
# The docker-compose analytics Postgres. type and timezone (Asia/Tokyo) live in
# config.yml.
databases:
  analytics:
    host: localhost
    port: 5433              # docker-compose maps the analytics Postgres here
    database: analytics
    username: postgres
    password: postgres

# --- KeyStore ----------------------------------------------------------------
# Named RSA key pairs for signing/verification. config.yml lists the entries the
# modules resolve; this section is where development provisions them.
# Each key supports public/private sources independently. Two source styles:
#   - file:  path to a DER-encoded key (PKIX for public, PKCS8 or PKCS1 for private).
#   - value: raw base64-encoded DER. Production deployments typically inject the
#            base64 string from a secret manager via env var; the demo inlines it
#            so the framework's `value:` source is exercised end-to-end.
# `make generate-keys` regenerates all DER files AND patches the inline
# `tokens-peer` public-key base64 between the BEGIN/END markers below.
keystore:
  keys:
    # Webhook signing — both halves loaded from DER files.
    webhook-signing:
      public:
        file: "certs/webhook_signing_public.der"
      private:
        file: "certs/webhook_signing_private.der"

    # tokens-our: our app's keypair for the JOSE-protected /tokens flow.
    # Both halves on disk — production pattern when keys are mounted via Kubernetes
    # secrets or external secret-manager projection (e.g., AWS Secrets Manager CSI).
    tokens-our:
      public:
        file: "certs/tokens_our_public.der"
      private:
        file: "certs/tokens_our_private.der"

    # tokens-peer: the simulated counterparty keypair (in production this would
    # be Visa Token Services or similar). Public is sourced via inline base64 to
    # exercise the `value:` source style; private stays on disk so the in-process
    # simulator can decrypt+sign as the peer would.
    tokens-peer:
      public:
        # BEGIN_TOKENS_PEER_PUB — managed by `make generate-keys`, do not edit by hand.
        value: ""
        # END_TOKENS_PEER_PUB
      private:
        file: "certs/tokens_peer_private.der"

    # --- Sealed messages: payments module (go-bricks v0.63.0, ADR-097) --------
    # These two are sealing GENERATION entries, not plain named keys. The
    # "-v<N>" name suffix is what gives an entry family semantics: the event
    # struct names only the LOGICAL kids —
    #     _ struct{} `seal:"sign=payments-sign,encrypt=payments-encrypt"`
    # — and the keystore resolves each family to its provisioned generations.
    # Rotation therefore never touches Go code: it adds payments-sign-v2 next to
    # v1 and flips messaging.seal.active (see the commented selector in the
    # messaging section of config.yml). Each family here has exactly ONE generation, so
    # that single generation auto-activates and no selector is needed.
    #
    # Both halves are provisioned for both families because this demo publishes
    # AND consumes in one process: the producer signs with payments-sign-v1
    # PRIVATE and encrypts to payments-encrypt-v1 PUBLIC, while the consumer
    # verifies with payments-sign-v1 PUBLIC and decrypts with
    # payments-encrypt-v1 PRIVATE. Split across two services, each side holds
    # only its own two halves — the roles invert, which is why the two families
    # rotate in opposite order. Deep dive: go-bricks wiki/sealing.md.
    #
    # Never reuse an entry name between the HTTP jose keys above and these: the
    # framework records which role tag resolved an entry and WARNs at startup
    # when one entry serves both.
    payments-sign-v1:
      public:
        file: "certs/payments_sign_v1_public.der"
      private:
        file: "certs/payments_sign_v1_private.der"

    payments-encrypt-v1:
      public:
        file: "certs/payments_encrypt_v1_public.der"
      private:
        file: "certs/payments_encrypt_v1_private.der"
