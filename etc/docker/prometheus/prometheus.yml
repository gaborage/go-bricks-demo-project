# Prometheus Configuration for go-bricks Observability
# Receives metrics from Grafana Alloy via remote_write API
# Note: Application metrics are now pushed via remote_write instead of scraping

global:
  scrape_interval: 15s      # How often to scrape targets
  evaluation_interval: 15s  # How often to evaluate rules
  external_labels:
    environment: 'development'
    cluster: 'local'

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself (for monitoring)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Optional: Scrape Alloy's own metrics (for monitoring the collector)
  - job_name: 'alloy'
    static_configs:
      - targets: ['grafana-alloy:12345']
        labels:
          service: 'grafana-alloy'

  # No job scrapes the application. go-bricks exports metrics by OTLP push only
  # (observability.metrics.endpoint: stdout or an OTLP collector) and serves no
  # /metrics route, so a scrape of host.docker.internal:8080/metrics only earned a
  # 404 and a WARN access-log line in the app every interval. Application metrics
  # arrive through Alloy instead:
  #   app --OTLP :4317--> grafana-alloy --remote_write--> /api/v1/write (this server)
  # which is why the server runs with --web.enable-remote-write-receiver.
