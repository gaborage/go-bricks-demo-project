# =============================================================================
# Go-Bricks Demo Project — Development Configuration
# =============================================================================
# Environment: development (loaded when APP_ENV=development)
# Override values from the base config.yaml (framework defaults).
# Environment variables override YAML (e.g., APP_NAME overrides app.name).
# =============================================================================

# --- HTTP Server ------------------------------------------------------------
# All routes — including health and ready — are mounted under this base path.
# The framework default for server.path.base is empty (routes at root), so the
# documented demo URLs (curl http://localhost:8080/api/v1/products) and the
# k6 load tests only resolve once this is set to /api/v1.
#
# health/ready resolve at /api/v1/health and /api/v1/ready respectively.
server:
  path:
    base: "/api/v1"
    health: "/health"
    ready: "/ready"
  # go-bricks v0.41.0 (#559, ADR-026) flipped the gzip threshold default from 0
  # (compress everything) to 1024 bytes, so responses < 1KB now ship uncompressed.
  # Pinned to 0 here to hold wire behavior constant vs v0.39.1 for the perf A/B —
  # otherwise small product/error JSON silently switches to plaintext and
  # confounds response-size/bandwidth comparisons. Set to 1024 (or delete this
  # block) to adopt the current framework default.
  gzip:
    minlength: 0

# --- Messaging (RabbitMQ) ---------------------------------------------------
# AMQP broker URL. Required for the outbox relay to publish events; without it
# the relay job logs "messaging not available" every poll_interval (5s).
# docker-compose runs RabbitMQ on localhost:5672. The URL omits user info on
# purpose — the Go amqp091 client fills guest/guest by default, and the broker
# is configured (etc/docker/rabbitmq/rabbitmq.conf) to accept guest from any
# source so credentials don't need to live in config files.
messaging:
  broker:
    url: "amqp://localhost:5672/"

  # --- Native stream protocol — activity module (ADR-059 / ADR-063 / ADR-091) -
  # A SECOND, independent lane. Streams speak the rabbitmq_stream protocol on
  # 5552, not AMQP on 5672, so this URI is deliberately NOT derived from
  # messaging.broker.url above: a deployment may expose one listener and not the
  # other. etc/docker/docker-compose.yml publishes 5552 and mounts
  # etc/docker/rabbitmq/enabled_plugins to turn the plugin on.
  #
  # ADR-091 (opt-in at the build graph): setting this uri is only half the
  # switch. The `messaging/streams` package must also be linked into the binary,
  # and any import of it does that. internal/modules/activity/module.go imports
  # it by NAME and uses it — it declares the topology, so it needs the package's
  # types anyway, and that same import is what links the lane. Only a process
  # that declares no topology of its own would need a blank `_` import instead.
  # With neither, startup FAILS with app.ErrStreamsNotLinked rather than
  # silently dropping every stream declaration. Neither uri nor import (the
  # state before this demo) starts clean.
  #
  # Credentials are spelled out here, unlike the AMQP url above: the stream
  # client does not default them. %2f is the URL-encoded default vhost "/".
  # Plaintext rabbitmq-stream:// is fine in development but WARNs outside it —
  # production terminates TLS in front of the broker or uses
  # rabbitmq-stream+tls:// (5551).
  streams:
    uri: "rabbitmq-stream://guest:guest@localhost:5552/%2f"

    # THE DOCKER TRAP (go-bricks wiki/streams.md, Configuration): a stream
    # client opens ONE connection per partition, and it learns where to dial
    # from the broker's own metadata response. Inside Docker the broker
    # advertises its container-internal address, which is unreachable from the
    # host — so the first connection (to the address in `uri`) succeeds and the
    # per-partition connections then fail. The address resolver pins every
    # connection to this one entry point instead. Required behind any port
    # mapping, NAT, or load balancer. Set BOTH fields or neither.
    addressresolver:
      host: localhost
      port: 5552

    # Offsets are stored SERVER-SIDE for a named consumer, which is what lets a
    # restart resume where it left off. They are committed only AFTER a handler
    # returns successfully, so this knob trades commit traffic against how much
    # already-handled work a crash replays.
    offsetstore:
      # A pending offset is committed on whichever comes FIRST: this many
      # successfully handled messages, or `flushinterval` since the last commit.
      # So the framework default of 500 would not stop a low-volume demo from
      # committing at all — the 5s flush below does it regardless. Lowering the
      # count to 10 only makes the COUNT-driven commit reachable, so a short
      # burst of product writes exercises that path instead of always the timer.
      # Production leaves this at the default.
      countbeforestorage: 10
      # flushinterval: 5s   # default: commit a pending offset after this long

  # Sealed messages — payments module (go-bricks v0.63.0, ADR-097).
  # A `seal:`-tagged event type encrypts its one declared Subject and signs the
  # whole document. Key material lives in keystore.keys below (generations
  # payments-sign-v1 / payments-encrypt-v1); this block only SELECTS which
  # provisioned generation seals NEW traffic — it never widens what can be
  # opened, since every message names the generation that sealed it.
  #
  # Deliberately absent here: a family with exactly one provisioned generation
  # auto-activates. Provision a second and startup refuses to guess — that is
  # when the selector below stops being optional.
  #
  # Rotation (framework wiki/sealing.md, "Rotation runbooks"): provision v2
  # everywhere FIRST, then flip the selector and redeploy. Both at once strands
  # in-flight and outbox-replayed v1 traffic in the DLQ as
  # SEAL_KID_UNKNOWN_GENERATION.
  # seal:
  #   active:
  #     payments-sign: "v2"

# --- Application ------------------------------------------------------------
# Rate limiting: framework defaults are app.rate.limit=100 / burst=200 per IP.
# The bundled k6 load tests (50+ VUs) blow through that limit and surface as
# 5-10% HTTP 429s, which makes them measure the limiter, not the pipeline they're
# supposed to benchmark. Raised here so dev/benchmark runs are unbottlenecked.
# Production typically tunes these per-tenant or relies on a CDN/WAF for IP
# throttling.
app:
  rate:
    limit: 2000
    burst: 4000

  # go-bricks v0.61.0 (ADR-084) gates the response body's error.details on
  # app.debug AND a development environment — the env alone used to be enough.
  # Without this the demo's 400s still carry code/message but lose the details
  # map, so the validationErrors list that makes the validation demo legible
  # never reaches the client. Development-only: details echo schema facts that
  # production responses should not carry.
  debug: true

# --- Logging ----------------------------------------------------------------
# go-bricks v0.39.0 (go-bricks#424) changed the default log output format from
# "json" to "auto": console (colored) only when stdout is a TTY AND OTLP log
# export is inactive — otherwise JSON. Pinned explicitly so `make run` keeps
# readable console output locally while still emitting JSON for the Loki/OTLP
# pipeline. NOTE: "console" combined with OTLP log export panics at startup;
# "auto" resolves that automatically.
log:
  output:
    format: auto   # auto | console | json

# --- Default Database -------------------------------------------------------
# Accessed by modules via deps.DB(ctx).
database:
  type: postgresql
  host: localhost
  port: 5432
  database: postgres
  username: postgres
  password: postgres

  # Session timezone (go-bricks v0.29.0+) — IANA name applied to EVERY new
  # physical connection. PostgreSQL receives it via the pgx StartupMessage's
  # RuntimeParams, so pool members spawned later (after drops, lifetime expiry,
  # or burst load) inherit the same setting — no one-shot drift.
  #
  # Behavior:
  #   "UTC"               (default if unset)        opinionated, environment-stable
  #   "America/New_York"  (any IANA name)           validated via time.LoadLocation
  #   "-"                 (sentinel)                opt out: inherit DB server default
  #   "+05:30"            (numeric offset)          REJECTED — use Etc/GMT-5 instead
  #
  # See: https://github.com/gaborage/go-bricks/blob/main/wiki/adr_016_database_session_timezone.md
  timezone: UTC
  # timezone: "-"   # legacy opt-out: inherit DB server default timezone (keep the quotes in YAML)

# --- Named Databases --------------------------------------------------------
# Accessed via deps.DBByName(ctx, "<name>"). The analytics module uses "analytics".
databases:
  analytics:
    type: postgresql
    host: localhost
    port: 5433              # docker-compose maps the analytics Postgres here
    database: analytics
    username: postgres
    password: postgres

    # Each named database gets its own timezone setting. Here we deliberately
    # pick a non-UTC zone to prove the per-connection enforcement: queries
    # against analytics report Tokyo time even when the default DB reports UTC.
    timezone: Asia/Tokyo
    # timezone: "-"   # legacy opt-out for the analytics named DB

# --- Transactional Outbox ---------------------------------------------------
# Reliable event publishing via the dual-write pattern.
# Events are written to an outbox table inside the same DB transaction as
# business data, then relayed to RabbitMQ by a background poller.
# NOTE (go-bricks v0.40.1, #549): config keys bind by their flat-smushed koanf
# tag (tablename, autocreatetable, …), NOT the underscored form. The pre-0.40.1
# underscored keys (table_name, auto_create_table, …) silently STOP binding on
# upgrade and fall back to their zero-value defaults with no error — which for
# this block means defaultexchange="" (events never route). Keep these
# flat-smushed.
outbox:
  enabled: true
  tablename: gobricks_outbox
  # The demo owns the outbox DDL. go-bricks v0.61.0 (ADR-088) reshaped the ledger
  # — rows gained `seq` and `lane`, and the relay takes a companion
  # <tablename>_leader row FOR UPDATE NOWAIT to admit exactly one drainer — and
  # framework autocreate only ever CREATEs a missing table, it never ALTERs an
  # existing one. So on a retained volume autocreate cannot migrate the old shape
  # and Init fails with TableUnusableError regardless of this flag. Owning the DDL
  # in migrations/V3__upgrade_outbox_ledger.sql makes the upgrade explicit and
  # replayable: run `make migrate` before `make run`.
  autocreatetable: false
  defaultexchange: product-events  # Target exchange when event.Exchange is empty
  pollinterval: 5s                 # How often the relay checks for unsent events
  batchsize: 100                   # Max events per relay cycle
  # go-bricks v0.45.0 (#626) reworked retry semantics and v0.61.0 (#1229) added a
  # second poison class. maxretries dead-letters only POISON events to
  # status='failed'. Two poison classes are reachable in THIS config (single
  # tenant, outbox.superstreams unset, so every row is lane='amqp'): undecodable
  # headers, and a destination the AMQP frame can never carry (exchange, routing
  # key or header key past the shortstr ceiling). Both are message-intrinsic —
  # refused identically every cycle, so retrying them forever is pointless.
  # outbox/relay.go dead-letters further classes this config does not reach: a
  # messaging.ErrTenantStampConflict, an unknown lane, and the stream-lane cases
  # (unknown stream, missing partition key). Connectivity
  # failures (broker down, NACK, publish-confirm timeout, missing exchange) advance
  # retry_count and retry INDEFINITELY — they never park. Monitor retry_count and
  # prune status='failed' rows manually (DeletePublished purges only 'published').
  maxretries: 5                    # Poison-event dead-letter threshold (NOT connectivity retries)
  retentionperiod: 72h             # How long delivered events are kept
  # publishtimeout bounds a single relay publish attempt (v0.45.0, default 60s).
  # HARD INVARIANT: publishtimeout MUST be >= messaging.reconnect.connectiontimeout
  # (default 30s) or the outbox module fails to Init. Raise this if you raise the
  # reconnect connection timeout.
  publishtimeout: 60s

# --- Inbox (consumer-side idempotency) --------------------------------------
# The durable complement to the outbox above: the inbox records processed event
# ids in a ledger and commits that row in the SAME transaction as the business
# write, so a redelivery is skipped instead of reprocessed.
#
# The sealed payments consumer REQUIRES it. A seal-tagged consumer dedups on the
# sealed envelope's "<sign family>:<jti>" key (messaging.Metadata.DedupKey), and
# the payments module refuses to Init when deps.Inbox is nil — so inbox.NewModule()
# must be registered in cmd/api/main.go before the payments module.
#
# Same koanf key rule as the outbox block above: keys are flat-smushed
# (`tablename`, `autocreatetable`, `retentionperiod`). An underscored key
# silently STOPS binding and falls back to its zero value with no error.
inbox:
  enabled: true
  # Framework default name, spelled out so the DDL and the config visibly agree.
  tablename: gobricks_inbox
  # The demo owns the inbox DDL (migrations/V4__create_inbox_ledger.sql), exactly
  # like the outbox above — run `make migrate` before `make run`. Framework
  # autocreate only ever CREATEs a missing table, it never ALTERs an existing
  # one, so managed migrations are the honest production pattern to showcase.
  autocreatetable: false
  # RETENTION IS THE REPLAY WINDOW. A message redelivered after its ledger row
  # was swept is processed AGAIN, so this MUST exceed the broker's maximum
  # redelivery window. It also bounds every DLQ drain, every outbox re-drive,
  # and the drain gate of a sealed-key rotation (wiki/sealing.md). 168h (7d) is
  # the framework default, pinned explicitly so the window is visible rather
  # than implied. Written as hours because Go durations have no "d" unit.
  retentionperiod: 168h
  # Where the ledger lives under multi-tenancy. "per-tenant" is the framework
  # default; in this single-tenant demo (multitenant.enabled is false) both
  # values behave identically — named here for the reader, not for effect.
  tenancy: per-tenant

# --- Scheduler --------------------------------------------------------------
# The scheduler drives the outbox relay job above. go-bricks v0.39.0
# (go-bricks#527) added scheduler.timezone — the IANA name used to interpret
# scheduled-job times. Unset now defaults to UTC; pinned explicitly to mirror
# database.timezone and document intent. Sentinel "-" opts out (host-local).
scheduler:
  timezone: UTC

# --- KeyStore ----------------------------------------------------------------
# Named RSA key pairs for signing/verification.
# Each key supports public/private sources independently. Two source styles:
#   - file:  path to a DER-encoded key (PKIX for public, PKCS8 or PKCS1 for private).
#   - value: raw base64-encoded DER. Production deployments typically inject the
#            base64 string from a secret manager via env var; the demo inlines it
#            so the framework's `value:` source is exercised end-to-end.
# `make generate-keys` regenerates all DER files AND patches the inline
# `tokens-peer` public-key base64 between the BEGIN/END markers below.
keystore:
  keys:
    # Webhook signing — both halves loaded from DER files.
    webhook-signing:
      public:
        file: "certs/webhook_signing_public.der"
      private:
        file: "certs/webhook_signing_private.der"

    # tokens-our: our app's keypair for the JOSE-protected /tokens flow.
    # Both halves on disk — production pattern when keys are mounted via Kubernetes
    # secrets or external secret-manager projection (e.g., AWS Secrets Manager CSI).
    tokens-our:
      public:
        file: "certs/tokens_our_public.der"
      private:
        file: "certs/tokens_our_private.der"

    # tokens-peer: the simulated counterparty keypair (in production this would
    # be Visa Token Services or similar). Public is sourced via inline base64 to
    # exercise the `value:` source style; private stays on disk so the in-process
    # simulator can decrypt+sign as the peer would.
    tokens-peer:
      public:
        # BEGIN_TOKENS_PEER_PUB — managed by `make generate-keys`, do not edit by hand.
        value: ""
        # END_TOKENS_PEER_PUB
      private:
        file: "certs/tokens_peer_private.der"

    # --- Sealed messages: payments module (go-bricks v0.63.0, ADR-097) --------
    # These two are sealing GENERATION entries, not plain named keys. The
    # "-v<N>" name suffix is what gives an entry family semantics: the event
    # struct names only the LOGICAL kids —
    #     _ struct{} `seal:"sign=payments-sign,encrypt=payments-encrypt"`
    # — and the keystore resolves each family to its provisioned generations.
    # Rotation therefore never touches Go code: it adds payments-sign-v2 next to
    # v1 and flips messaging.seal.active (see the commented selector in the
    # messaging section above). Each family here has exactly ONE generation, so
    # that single generation auto-activates and no selector is needed.
    #
    # Both halves are provisioned for both families because this demo publishes
    # AND consumes in one process: the producer signs with payments-sign-v1
    # PRIVATE and encrypts to payments-encrypt-v1 PUBLIC, while the consumer
    # verifies with payments-sign-v1 PUBLIC and decrypts with
    # payments-encrypt-v1 PRIVATE. Split across two services, each side holds
    # only its own two halves — the roles invert, which is why the two families
    # rotate in opposite order. Deep dive: go-bricks wiki/sealing.md.
    #
    # Never reuse an entry name between the HTTP jose keys above and these: the
    # framework records which role tag resolved an entry and WARNs at startup
    # when one entry serves both.
    payments-sign-v1:
      public:
        file: "certs/payments_sign_v1_public.der"
      private:
        file: "certs/payments_sign_v1_private.der"

    payments-encrypt-v1:
      public:
        file: "certs/payments_encrypt_v1_public.der"
      private:
        file: "certs/payments_encrypt_v1_private.der"
