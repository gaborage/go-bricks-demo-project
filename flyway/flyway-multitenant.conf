# Flyway configuration for the schema-per-tenant migration demo.
#
# Unlike flyway-postgresql.conf (which hardcodes flyway.schemas=public), this
# config deliberately omits flyway.schemas. When unset, Flyway resolves the
# default schema via the JDBC session's current_schema(), which honors the
# role's search_path. Per-tenant roles are configured with
# ALTER ROLE <tenant> SET search_path TO <schema> in
# etc/docker/postgres/multitenant-init.sql, so each tenant's
# flyway_schema_history lands inside its own schema.
#
# ROUTING — who supplies the target, and which source wins:
#
#   * go-bricks-migrate (`make migrate-multitenant`) populates
#     DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD from each
#     multitenant.tenants.<id>.database block (migration/flyway.go) AND, since
#     go-bricks v0.61.0 (ADR-085), builds the PostgreSQL JDBC URL itself from the
#     same block and passes it as `-url=` on the argv
#     (migration/flyway_url.go urlArgs). Flyway ranks argv above config files, so
#     on this path flyway.url below is SILENTLY IGNORED: the framework-built URL
#     decides host, port, database, sslmode and ApplicationName. Only
#     flyway.user/flyway.password still read the env vars.
#     scripts/flyway-docker.sh rewrites the host inside that `-url=` for the
#     compose network, mirroring the DB_HOST rewrite it already did.
#
#   * scripts/capture-flyway-samples.sh drives the Flyway CLI directly with only
#     `-configFiles=` plus the same DB_* env vars and NO `-url=`. flyway.url below
#     is load-bearing on that path, which is the only reason the key remains.
#
# So editing flyway.url changes the sample-capture run only; it cannot move where
# go-bricks-migrate points.

# Database connection
flyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
flyway.user=${DB_USER}
flyway.password=${DB_PASSWORD}

# Migration settings
flyway.table=flyway_schema_history
flyway.baselineOnMigrate=true
flyway.validateMigrationNaming=true
flyway.outOfOrder=false

# Placeholder replacement
flyway.placeholderReplacement=true
flyway.placeholders.appName=go-bricks-demo-multitenant

# Encoding
flyway.encoding=UTF-8

# Validate every migrate run; surfaces checksum drift before applying further work
flyway.validateOnMigrate=true

# Logging
flyway.loggers=console
