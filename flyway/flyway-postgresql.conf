# Flyway Configuration for PostgreSQL
#
# REFERENCE TEMPLATE — nothing in this repo passes this file today. `make migrate`
# runs the dockerized `flyway` service in etc/docker/docker-compose.yml, which is
# driven entirely by FLYWAY_URL/FLYWAY_USER/FLYWAY_PASSWORD/FLYWAY_SCHEMAS env
# vars and never mounts this file. The multi-tenant demo uses
# flyway/flyway-multitenant.conf instead.
#
# If you do hand this file to go-bricks-migrate (--flyway-config): since go-bricks
# v0.61.0 (ADR-085) the CLI builds the PostgreSQL JDBC URL from the database.*
# block and passes it as `-url=` on the argv, where it OUTRANKS flyway.url below,
# which is then silently ignored. The five DB_* env vars still arrive, but only
# flyway.user/flyway.password read them. flyway.url is kept so the file still
# stands alone for a plain `flyway -configFiles=...` invocation.

# Database connection (environment variables set by go-bricks)
flyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
flyway.user=${DB_USER}
flyway.password=${DB_PASSWORD}

# Schema management
flyway.schemas=public
flyway.defaultSchema=public

# Migration settings
flyway.table=flyway_schema_history
flyway.baselineOnMigrate=true
flyway.validateMigrationNaming=true
flyway.outOfOrder=false

# Placeholder replacement (allows parameterized SQL)
flyway.placeholderReplacement=true
flyway.placeholders.env=${flyway.env}
flyway.placeholders.appName=go-bricks-demo

# Encoding
flyway.encoding=UTF-8

# Mixed mode (allow both versioned and repeatable migrations)
flyway.mixed=true

# Validation
flyway.validateOnMigrate=true

# Logging
flyway.loggers=console
